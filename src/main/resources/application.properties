server.port=8080
spring.application.name=LUMA

# Database Configuration (H2 in-memory with console enabled)
spring.datasource.url=jdbc:h2:mem:lumadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# LUMA Security & JWT Configuration
luma.app.jwtSecret=9a4f2c8d7e1b5a3f6c8e0d2b4a6c8e0f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1
luma.app.jwtExpirationMs=86400000
luma.upload.dir=./uploads

# Jackson & JPA Serialization Safety
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=true
